name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# 发布需要写权限创建 GitHub Release;仓库默认 token 为只读会导致 403
# ("Resource not accessible by integration")
permissions:
  contents: write

jobs:
  # 回归门禁:每次 PR / push / tag 都跑全量测试
  test:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew test

  # 发布:打 v* 标签(如 v1.9.3)触发 —— 构建 release APK 并上传到对应 GitHub Release
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # 作业级 env:step 的 if 只能看到作业/工作流级 env(看不到 secrets 直接引用)
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # 若配置了签名 secrets(KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD),
      # 写入 local.properties 以便正式签名发布;未配置则产出未签名 APK(可手动补签名)。
      - name: Configure release signing (if secrets provided)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > goodnight-release.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "goodnight-release.keystore" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > local.properties
      - name: Build release APK
        run: ./gradlew assembleRelease
      # 资产命名统一为 GoodNight-<版本>.apk(与 scripts/release.sh 一致)
      - name: Rename APK asset
        run: cp app/build/outputs/apk/release/app-release.apk "GoodNight-${GITHUB_REF_NAME#v}.apk"
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: GoodNight-*.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
